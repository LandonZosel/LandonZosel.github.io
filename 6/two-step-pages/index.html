<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Landon Zosel">
    <meta name="description" content="A website detailing information about the orchestra">
    <meta name="keywords" content="Landon,Zosel,Music,Orchestra">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Orchestra</title>
    <link rel="icon" href="../img/music.ico">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="siteContainer">
        <header>
            <p class="headerTitle">The Orchestra</p>
            <nav>
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="#">Instruments</a></li>
                    <li><a href="../static-page/index.html">Music Theory</a></li>
                    <li><a href="../contact-us-page/index.html">Contact Us</a></li>
                </ul>
            </nav>
        </header>
        <main class="mainContainer">
            <div class="pageTitleContainer" id="title">
                <h1>Instruments</h1>
            </div>
            <div id="choices">
                <div class="rowContainer">
                    <div class="figureContainer">
                        <figure>
                            <button class="imageButton" id="topLeftButton">
                                <img class="mediumImage" id="topLeftImg" src="../img/idiophones.jpg" alt="A women hitting a bowl with a mallet">
                            </button>
                            <figcaption>
                                <div class="pageHeaderContainer">
                                    <h2 id="topLeftText">Idiophones</h2>
                                </div>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="figureContainer">
                        <figure>
                            <button class="imageButton" id="topRightButton">
                                <img class="mediumImage" id="topRightImg" src="../img/membranophones.jpg" alt="A man beating a drum head">
                            </button>
                            <figcaption>
                                <div class="pageHeaderContainer">
                                    <h2 id="topRightText">Membranophones</h2>
                                </div>
                            </figcaption>
                        </figure>
                    </div>
                </div>
                <div class="rowContainer">
                    <div class="figureContainer">
                        <figure>
                            <button class="imageButton" id="botLeftButton">
                                <img class="mediumImage" id="botLeftImg" src="../img/chordophones.jpg" alt="A woman plucking a harp">
                            </button>
                            <figcaption>
                                <div class="pageHeaderContainer">
                                    <h2 id="botLeftText">Chordophones</h2>
                                </div>
                            </figcaption>
                        </figure>
                    </div>
                    <div class="figureContainer">
                        <figure>
                            <button class="imageButton" id="botRightButton">
                                <img class="mediumImage" id="botRightImg" src="../img/aerophones.jpg" alt="A man blowing into the open air">
                            </button>
                            <figcaption>
                                <div class="pageHeaderContainer">
                                    <h2 id="botRightText">Aerophones</h2>
                                </div>
                            </figcaption>
                        </figure>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <div>
                <small>™ & COPYRIGHT &copy; 2026 BY Landon Zosel Independent Contractor.<br>
                ALL RIGHTS RESERVED.</small>
            </div>     
        </footer>

    <script src="../js/two-step.js"></script>
